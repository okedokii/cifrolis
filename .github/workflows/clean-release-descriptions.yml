name: Clean release descriptions
on:
  push:
    branches: [main]
    paths: ['ci/strip_release_optimization.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Remove exact phrase from existing release descriptions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 ci/strip_release_optimization.py
