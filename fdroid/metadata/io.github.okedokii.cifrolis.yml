Name: Цифролис
Summary: Просмотр веб-страниц, в том числе защищенных сертификатами Минцифры
Description: |
  <p>Firefox для Android со встроенными сертификатами Минцифры. Неофициальная сборка.</p>
  
  <p><b>Преимущества</b></p>
  
  <ul>
  <li><b>Готов к работе</b> — сертификаты уже встроены.</li>
  <li><b>Без изменений в Android</b> — системное хранилище сертификатов не затрагивается.</li>
  <li><b>Рядом с Firefox</b> — устанавливается как отдельное приложение.</li>
  </ul>
  
  <p><b>FAQ</b></p>
  
  <p><b>Зачем нужны сертификаты Минцифры?</b>
  Чтобы браузер мог устанавливать защищённое соединение с сайтами, использующими эти сертификаты (банки, государственные сервисы, платёжные системы), без ошибок доверия.</p>
  
  <p><b>Нужно устанавливать сертификаты вручную?</b>
  Нет, они уже включены в браузер.</p>
  
  <p><b>Как проверить поддержку сертификатов?</b>
  Откройте в Цифролисе <a href="https://www.sberbank.ru/ru/certificates">страницу проверки Сбербанка</a>. Она сразу покажет, поддерживает ли браузер сертификаты Минцифры.</p>
  
  <p><b>Сертификаты появятся в других приложениях?</b>
  Нет, встроенные сертификаты действуют только внутри Цифролиса.</p>
  
  <p><b>Это официальный Firefox?</b>
  Нет, это независимая сборка на его основе.</p>
